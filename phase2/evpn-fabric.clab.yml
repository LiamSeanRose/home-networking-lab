name: evpn-fabric

# Pin the management bridge name so Zeek and other host tools can rely on it.
# Without this, Containerlab picks a random br-xxxxxxxxxxxx name on every deploy.
mgmt:
  network: clab-mgmt
  bridge: clab-mgmt
  ipv4-subnet: 172.20.20.0/24

topology:
  kinds:
    ceos:
      image: ceos:4.36.0F
    linux:
      image: alpine:3.24

  nodes:
    spine1:
      kind: ceos
      mgmt-ipv4: 172.20.20.11
      startup-config: configs/spine1.cfg

    leaf1:
      kind: ceos
      mgmt-ipv4: 172.20.20.21
      startup-config: configs/leaf1.cfg

    leaf2:
      kind: ceos
      mgmt-ipv4: 172.20.20.22
      startup-config: configs/leaf2.cfg

    host1:
      kind: linux
      mgmt-ipv4: 172.20.20.101
      exec:
        - ip link set eth1 up
        - ip addr add 10.100.100.11/24 dev eth1

    host2:
      kind: linux
      mgmt-ipv4: 172.20.20.102
      exec:
        - ip link set eth1 up
        - ip addr add 10.100.100.12/24 dev eth1

  links:
    - endpoints: ["spine1:eth1", "leaf1:eth1"]
    - endpoints: ["spine1:eth2", "leaf2:eth1"]
    - endpoints: ["leaf1:eth2", "host1:eth1"]
    - endpoints: ["leaf2:eth2", "host2:eth1"]
