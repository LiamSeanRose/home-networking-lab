# /etc/filebeat/filebeat.yml
# Ship Zeek JSON logs from /opt/zeek/logs/current/ to the local single-node Elasticsearch.

filebeat.modules:
  - module: zeek
    capture_loss:
      enabled: true
      var.paths: ["/opt/zeek/logs/current/capture_loss.log"]
    connection:
      enabled: true
      var.paths: ["/opt/zeek/logs/current/conn.log"]
    dns:
      enabled: true
      var.paths: ["/opt/zeek/logs/current/dns.log"]
    notice:
      enabled: true
      var.paths: ["/opt/zeek/logs/current/notice.log"]
    weird:
      enabled: true
      var.paths: ["/opt/zeek/logs/current/weird.log"]

output.elasticsearch:
  hosts: ["http://localhost:9200"]
  preset: balanced

setup.kibana:
  host: "http://localhost:5601"

# Single node = no replicas. With the default of 1 replica the indices stay yellow forever.
setup.template.settings:
  index.number_of_shards: 1
  index.number_of_replicas: 0

logging.level: info
logging.to_files: true
logging.files:
  path: /var/log/filebeat
  name: filebeat
  keepfiles: 7
  permissions: 0644
